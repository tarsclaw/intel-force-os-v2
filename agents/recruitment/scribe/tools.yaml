# Scribe agent — tools.yaml (capability declarations)
#
# Status: built (W6 build slice; cycle.sh/validate.sh/context.sh/cleanup.sh
#         are LIVE against these declarations. Live Bullhorn + Granola smoke
#         remains founder-gated: Bullhorn dev creds EMPTY + Granola IFOS-side
#         OAuth token not on disk + 0 recorded meetings — spec-002 §8/§9).
# Reading order: agent.md §1 (output contract) + §2 (invocation surface) +
#         §4 (workflow + capability dependencies) first.
#
# BRIDGE NOTE (parallel-conflict rule): every @ifos/bullhorn invocation routes
# through agents/recruitment/scribe/bin/bh-bridge.sh — the single
# reconciliation point for the CLI bridge the Janitor build slice owns under
# packages/mcp-connectors/bullhorn. The shim header documents the exact CLI
# command surface it expects (refresh / update-entity / create-note).
#
# Per ADR-003 agent-bundle pattern: tools.yaml declares every external
# capability cycle.sh invokes + the autosend-policy action_type each
# state-changing call emits. cortextOS bus uses this to authorise capability
# invocation per agent (no capability declared here = bus refuses the call).
#
# Scribe consumes BOTH @ifos/bullhorn (write surface) AND @ifos/granola
# (read surface). Vendor delta from agent.md: agent.md describes Fathom /
# Fireflies as the transcript provider; SKELETON uses Granola per Day-29
# vendor pivot (founder confirmed 2026-06-03). cycle.sh Reading-discipline
# note + scribe/agent.md Reading-discipline note document the delta.
#
# Action types referenced below MUST exist in agents/_shared/autosend-policy.yaml.
# Scribe's 2 yellow-tier write action_types (bullhorn_scribe_field_write +
# bullhorn_note_append_summary) are REGISTERED in autosend-policy.yaml
# (re-verified 2026-06-10 — lines 240 + 212 respectively). scribe_cleanup /
# bullhorn_oauth / granola_oauth remain QUEUED (registering them needs an
# agents/_shared edit — outside this build slice's boundary; see the
# registration-status footer for how each is recorded meanwhile).

version: "0.1"
agent: scribe

capabilities:

  # ────────────────────────────────────────────────────────────────────────
  # Bullhorn ATS — invoked via bin/bh-bridge.sh (see BRIDGE NOTE above).
  # cycle.sh Step 8 maps entity_type → Bullhorn type (candidate→Candidate,
  # contact→ClientContact, brief→JobOrder, placement→Placement); opportunity
  # is IFOS-cached-Postgres-only per agent.md §3 (no v1.0 Bullhorn endpoint).
  # While the bridge CLI is unbuilt, Step 8 writes the IFOS entities cache and
  # records bullhorn_push:deferred_bridge_unavailable on the action row;
  # Step 9 defers the note attach (note_attach_deferred output row).
  # Reference: bullhorn-integration-path.md §4.1 A3 (Scribe scope).
  # Schema-clean post v0.4 supplement (LIVE on VPS 2026-06-03; commit a1bbcf6).
  # ────────────────────────────────────────────────────────────────────────

  - id: bullhorn_oauth
    package: "@ifos/bullhorn"
    purpose: "Bullhorn two-step OAuth refresh (Step A OAuth + Step B REST login per @ifos/bullhorn src/auth.ts); per-corporation_id Promise dedup + 401-force-refresh per cluster F R4 lesson"
    action_type: bullhorn_oauth          # green tier; QUEUED for registration at W6
    cycle_step: 2
    secrets_required: [BULLHORN_CLIENT_ID, BULLHORN_CLIENT_SECRET]
    rate_limit_hint: "per-corporation_id 600/min hard / 480/min soft (see @ifos/bullhorn README §Rate limits)"

  - id: bullhorn_list_candidates
    package: "@ifos/bullhorn"
    purpose: "List candidates matching transcript participants (Step 4 entity resolution)"
    cycle_step: 4
    state_changing: false

  - id: bullhorn_get_candidate
    package: "@ifos/bullhorn"
    purpose: "Single-entity candidate fetch (Step 4 entity hydration)"
    cycle_step: 4
    state_changing: false

  - id: bullhorn_list_contacts
    package: "@ifos/bullhorn"
    purpose: "List contacts matching transcript participants (Step 4)"
    cycle_step: 4
    state_changing: false

  - id: bullhorn_get_contact
    package: "@ifos/bullhorn"
    purpose: "Single-entity contact fetch (Step 4)"
    cycle_step: 4
    state_changing: false

  - id: bullhorn_update_candidate
    package: "@ifos/bullhorn"
    purpose: "Write structured fields extracted from transcript onto Candidate entity (Step 8); v1.0 SUPPORTED capability"
    action_type: bullhorn_scribe_field_write  # yellow tier; REGISTERED in autosend-policy.yaml line 240
    cycle_step: 8
    state_changing: true

  - id: bullhorn_update_contact
    package: "@ifos/bullhorn"
    purpose: "Write structured fields onto Contact entity (Step 8); v1.0 LIMITATION: requires @ifos/bullhorn v0.2+ (updateContact not yet exported); declared for ratification continuity"
    action_type: bullhorn_scribe_field_write  # yellow tier; REGISTERED
    cycle_step: 8
    state_changing: true
    # PENDING upstream: updateContact not yet exported by @ifos/bullhorn —
    # bin/bh-bridge.sh `update-entity --type ClientContact` is the call site
    # to reconcile when the Janitor bridge lands

  - id: bullhorn_update_brief
    package: "@ifos/bullhorn"
    purpose: "Write structured fields onto Brief/JobOrder entity (Step 8); v1.0 LIMITATION: requires @ifos/bullhorn v0.2+ (updateBrief not yet exported); declared for ratification continuity"
    action_type: bullhorn_scribe_field_write  # yellow tier; REGISTERED
    cycle_step: 8
    state_changing: true
    # PENDING upstream: updateBrief not yet exported by @ifos/bullhorn —
    # bin/bh-bridge.sh `update-entity --type JobOrder` is the call site

  - id: bullhorn_update_placement
    package: "@ifos/bullhorn"
    purpose: "Write structured fields onto Placement entity (Step 8); v1.0 LIMITATION: requires @ifos/bullhorn v0.2+ (updatePlacement not yet exported); declared for ratification continuity"
    action_type: bullhorn_scribe_field_write  # yellow tier; REGISTERED
    cycle_step: 8
    state_changing: true
    # PENDING upstream: updatePlacement not yet exported by @ifos/bullhorn —
    # bin/bh-bridge.sh `update-entity --type Placement` is the call site

  - id: bullhorn_create_note
    package: "@ifos/bullhorn"
    purpose: "Attach tacit-note narrative (mirror of vault artefact from Step 6) onto Bullhorn entity (Step 9)"
    action_type: bullhorn_note_append_summary  # yellow tier; REGISTERED in autosend-policy.yaml line 212
    cycle_step: 9
    state_changing: true

  # ────────────────────────────────────────────────────────────────────────
  # Granola MCP wrapper (read surface; 5 of 6 official tools — listFolders
  # NOT consumed by Scribe per agent.md §4 + Day-29 vendor pivot)
  # Reference: @ifos/granola README §Scribe consumption pattern;
  # mcp.granola.ai/mcp official server.
  # ────────────────────────────────────────────────────────────────────────

  - id: granola_oauth
    package: "@ifos/granola"
    purpose: "Granola OAuth 2.1 + PKCE + DCR refresh (per-workspace_id Promise dedup + atomic file write per @ifos/granola src/auth.ts); Scribe pre-cache plan_tier='paid' via getAccountInfo at session start"
    action_type: granola_oauth   # green tier; QUEUED for registration at W6
    cycle_step: 2
    secrets_required: [GRANOLA_CLIENT_ID]   # PKCE flow has no client_secret
    rate_limit_hint: "per-workspace_id 60/min hard / 48/min soft (see @ifos/granola README §Rate limits)"

  - id: granola_list_meetings
    package: "@ifos/granola"
    purpose: "List meetings since CTX_GRANOLA_LAST_POLL (cycle.sh Step 1 poll-sweep loop discovery); free plan returns last 30d only per Granola docs — Scribe assumes Paid (founder 2026-06-03)"
    cycle_step: 1
    state_changing: false

  - id: granola_get_meeting
    package: "@ifos/granola"
    purpose: "Single-meeting hydrate for replay mode (manual --call-id <meeting_id> invocation per agent.md §2)"
    cycle_step: 3
    state_changing: false

  - id: granola_query_meetings
    package: "@ifos/granola"
    purpose: "Semantic search across meeting notes (v1.1+ for backfill of historical context; v1.0 unused by cycle.sh — declared for capability surface set-equality with @ifos/granola exports)"
    cycle_step: null
    state_changing: false
    # NOTE: declared but not consumed at v1.0 — Scribe's poll-sweep uses
    # list_meetings + getTranscript; queryMeetings is for v1.1+ retroactive
    # taxonomy backfill (re-running extraction against historical transcripts).

  - id: granola_get_transcript
    package: "@ifos/granola"
    purpose: "Fetch meeting transcript with speaker segments (Step 3 per-meeting fetch); PAID PLANS ONLY — Scribe pre-guards via CTX_GRANOLA_PLAN_TIER from getAccountInfo cache (Step 0); 10-min cache TTL per @ifos/granola"
    cycle_step: 3
    state_changing: false
    plan_tier_required: paid   # Scribe gates this before invocation

  - id: granola_get_account_info
    package: "@ifos/granola"
    purpose: "Workspace + plan_tier introspection (context.sh Step 3 pre-caches plan_tier='paid' for the cycle.sh session; 1h TTL per @ifos/granola)"
    cycle_step: 0
    state_changing: false

  # ────────────────────────────────────────────────────────────────────────
  # Voice classifier (Step 6 tacit-note narrative voice scoring)
  # Reference: agent.md §7; _shared/voice-loader.sh + hh_load_tone_rules.
  # ────────────────────────────────────────────────────────────────────────

  - id: voice_classifier
    package: "@ifos/voice-classifier"   # W4-5 polish microservice (per agent.md §8 build deps)
    purpose: "Score tacit-note narrative against tenant voice corpus (≥0.75 required by Gate A G3); ESC_VOICE_DRIFT below threshold after 3 retries"
    cycle_step: 6
    state_changing: false
    # NOTE: @ifos/voice-classifier microservice is W4-5 polish work per
    # agent.md §8 — may not exist as a standalone package at this scaffold
    # state; cycle.sh Step 6 will integrate with whatever shape that lands
    # at W4-5 (likely an HTTP microservice OR an LLM-prompt-wrapper).

  # ────────────────────────────────────────────────────────────────────────
  # Cleanup (cleanup.sh)
  # ────────────────────────────────────────────────────────────────────────

  - id: scribe_cleanup
    purpose: "Post-run cleanup (transient @ifos/bullhorn + @ifos/granola cache purge + /tmp transcript purge + last-poll cache file update)"
    action_type: scribe_cleanup   # green tier; QUEUED for registration at W6
    state_changing: false
    cycle_step: 10

# ──────────────────────────────────────────────────────────────────────────────
# Failure-modes table (per cluster Fbis pattern; ESC mapping per agent.md §6)
# ──────────────────────────────────────────────────────────────────────────────

failure_modes:

  - condition: "@ifos/bullhorn OAuth refresh fails after 2 retries (cycle.sh Step 2)"
    surface: "BullhornAuthError thrown by @ifos/bullhorn"
    escalation: ESC_BULLHORN_AUTH    # blocking; operator + ifos_oncall_chat_id per catalogue §2.5

  - condition: "@ifos/granola OAuth refresh fails (cycle.sh Step 2; context.sh Step 5)"
    surface: "GranolaAuthError thrown by @ifos/granola"
    escalation: ESC_GRANOLA_AUTH     # blocking-equivalent; QUEUED for catalogue registration at W6
    queued: true

  - condition: "@ifos/bullhorn returns 4xx/5xx on Step 8 field write OR Step 9 note attach"
    surface: "BullhornError (4xx skip; 5xx retry-once-then-skip)"
    escalation: ESC_BULLHORN_WRITE_FAIL   # warn; operator_chat_id

  - condition: "@ifos/granola returns 4xx/5xx on Step 1 listMeetings OR Step 3 getTranscript"
    surface: "GranolaError; per agent.md §6 ESC_PROVIDER_FETCH_FAIL covers transcript-provider failures generically (v1.0 payload extension upstream='granola')"
    escalation: ESC_PROVIDER_FETCH_FAIL   # warn; operator_chat_id

  - condition: "@ifos/granola returns 403 on Step 3 getTranscript (Paid-plan tool on Free workspace)"
    surface: "GranolaPlanTierInsufficientError"
    escalation: ESC_GRANOLA_PLAN_TIER     # warn; QUEUED for catalogue registration at W6; consumer degrades to notes-only ingest

  - condition: "@ifos/bullhorn OR @ifos/granola returns 429"
    surface: "BullhornRateLimitError OR GranolaRateLimitError"
    escalation: ESC_RATE_LIMIT_HIT   # warn; operator_chat_id; payload.upstream='bullhorn'|'granola'

  - condition: "Tacit-note voice classifier <0.75 after 3 retries (Step 6 → validate.sh G3)"
    surface: "validate.sh exit 1 with G3 failure"
    escalation: ESC_VOICE_DRIFT      # warn; operator_chat_id

  - condition: "PII detected outside firm boundary in tacit-note narrative (validate.sh G6)"
    surface: "validate.sh exit 1 with G6 failure"
    escalation: ESC_PII_LEAKAGE_RISK   # blocking; operator + ifos_oncall_chat_id

  - condition: "<3 structured-field extractions with confidence ≥0.6 (Step 5 → validate.sh G2)"
    surface: "validate.sh exit 1 with G2 failure"
    escalation: ESC_FIELD_EXTRACTION_LOW_CONFIDENCE   # warn; operator_chat_id

  - condition: "Field name not in vertical-schema OR per-field type/range validation fails (validate.sh G4 + G5)"
    surface: "validate.sh exit 1 with G4 or G5 failure"
    escalation: ESC_SCHEMA_VIOLATION   # warn; operator_chat_id per catalogue line 163

  - condition: "Tacit-note word count >800 (validate.sh G7) — output-shape constraint"
    surface: "validate.sh exit 1 with G7 failure"
    escalation: ESC_AGENT_OUTPUT_SHAPE   # warn; operator_chat_id per catalogue line 184

  - condition: "No resolvable target entity at Step 4 (transcript participants don't match any Bullhorn contact/candidate)"
    surface: "cycle.sh Step 4 emits validate_gate_a_fail + skips meeting"
    escalation: ESC_AGENT_OUTPUT_SHAPE   # warn; operator_chat_id

  - condition: "Summary-render >30 min OR note-attach >1h after meeting end (Step 10)"
    surface: "cycle.sh Step 10 elapsed_seconds calculation"
    escalation: ESC_SCRIBE_SLA_MISS   # warn; operator_chat_id per catalogue §2.10; aggregates to Gate B

  - condition: "Both Gate B metrics (≥90% within-5-min SLA + ≤20% structured-field edit-rate) below target for 30 consecutive days"
    surface: "monthly day-30 metrics roll-up"
    escalation: ESC_GATE_B_MISS       # warn; operator_chat_id; likely LLM prompt drift or taxonomy mismatch

