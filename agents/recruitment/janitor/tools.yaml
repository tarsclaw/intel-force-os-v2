# Janitor agent — tools.yaml (capability declarations)
#
# Status: BUILT (W6-7 build slice; spec-001) — cycle.sh 12 steps + validate.sh
#         Gate A G1-G7 LIVE; Bullhorn capabilities wired through the
#         @ifos/bullhorn dist/cli.js bridge. Live Bullhorn calls are
#         founder-gated (creds EMPTY per spec-001 §8) — until creds land the
#         agent scans the Postgres entities cache and records Step 9 writes
#         with write_state:deferred_no_bullhorn_creds. Companies House is the
#         live-capable enrichment path (key SET).
# Reading order: agent.md §1 (output contract) + §2 (invocation surface) +
#         §4 (workflow + capability dependencies) first.
#
# Per ADR-003 agent-bundle pattern: tools.yaml declares every external
# capability cycle.sh invokes + the autosend-policy action_type each
# state-changing call emits. cortextOS bus uses this to authorise capability
# invocation per agent (no capability declared here = bus refuses the call).
#
# Action types referenced below MUST exist in agents/_shared/autosend-policy.yaml.
# Janitor's 3 yellow-tier write action_types (bullhorn_candidate_dedupe +
# bullhorn_field_backfill + bullhorn_note_attach) are all already REGISTERED
# in autosend-policy.yaml (verified 2026-06-03 — see status table at bottom).
# janitor_cleanup is QUEUED for registration at W6-7 build start (matches
# the cash_conductor_cleanup pattern).

version: "0.1"
agent: janitor

capabilities:

  # ────────────────────────────────────────────────────────────────────────
  # Bullhorn ATS (R+W on Candidate/Contractor/Contact/Client; W only on Note)
  # Reference: bullhorn-integration-path.md §4.1 A2 (Janitor scope).
  # Schema-clean post v0.4 supplement (LIVE on VPS 2026-06-03; commit a1bbcf6)
  # — bullhorn_corporation_id is top-level allowlisted in
  # validate_tenant_adapters_config_v0_4.
  # ────────────────────────────────────────────────────────────────────────

  - id: bullhorn_oauth
    package: "@ifos/bullhorn"
    purpose: "Bullhorn two-step OAuth refresh (Step A OAuth at auth-{region}.bullhornstaffing.com + Step B REST login at rest.bullhornstaffing.com/rest-services/login → BhRestToken + per-corp restUrl) per @ifos/bullhorn src/auth.ts; per-corporation_id Promise dedup + 401-force-refresh per cluster F R4 lesson. Invoked via dist/cli.js refresh (CLI bridge built this slice)"
    action_type: bullhorn_oauth          # green tier; QUEUED for registration (substrate-owner change to autosend-policy.yaml; agents/_shared/ frozen this slice)
    cycle_step: 1
    secrets_required: [BULLHORN_CLIENT_ID, BULLHORN_CLIENT_SECRET]
    rate_limit_hint: "per-corporation_id 600/min hard / 480/min soft (see @ifos/bullhorn README §Rate limits)"

  - id: bullhorn_list_candidates
    package: "@ifos/bullhorn"
    purpose: "List candidates modified since janitor_last_run (Step 2 scan); query support via Lucene-style filter"
    cycle_step: 2
    state_changing: false

  - id: bullhorn_get_candidate
    package: "@ifos/bullhorn"
    purpose: "Single-entity candidate fetch (Step 3 dedup pair hydration + Gate A G3 recent-activity check)"
    cycle_step: 3
    state_changing: false

  - id: bullhorn_update_candidate
    package: "@ifos/bullhorn"
    purpose: "Merge dedup pair (Step 9) OR backfill missing canonical fields (Step 9); action_type discriminates by mutation type"
    action_type: bullhorn_candidate_dedupe  # yellow tier; REGISTERED in autosend-policy.yaml line 191 (sample_rate 10) for merge mutations
    # NOTE: when this capability fires for a field-backfill rather than a merge,
    # the emitting action_type is bullhorn_field_backfill (yellow tier; REGISTERED
    # line 198; sample_rate 10) — cycle.sh Step 9 selects the action_type per
    # mutation type. Both action_types share this single bullhorn_update_candidate
    # capability (the autosend-policy tier discriminator + audit row records which).
    cycle_step: 9
    state_changing: true

  - id: bullhorn_list_contacts
    package: "@ifos/bullhorn"
    purpose: "List contacts modified since janitor_last_run (Step 2); fed into Step 3-4 dedup pair candidate pool"
    cycle_step: 2
    state_changing: false

  - id: bullhorn_get_contact
    package: "@ifos/bullhorn"
    purpose: "Single-entity contact fetch (Step 3-4 dedup pair hydration)"
    cycle_step: 3
    state_changing: false

  - id: bullhorn_list_clients
    package: "@ifos/bullhorn"
    purpose: "List ClientCorporation rows modified since janitor_last_run (Step 2); fed into Step 5 field completeness audit + Step 6 Companies House enrichment"
    cycle_step: 2
    state_changing: false

  - id: bullhorn_get_client
    package: "@ifos/bullhorn"
    purpose: "Single-entity ClientCorporation fetch (Step 5-6)"
    cycle_step: 5
    state_changing: false

  - id: bullhorn_update_client
    package: "@ifos/bullhorn"
    purpose: "Backfill missing canonical client fields (client.industry / client.companies_house_number / client.size_employees) from Step 6 Companies House enrichment (Step 9 write; updateClient added to @ifos/bullhorn this slice)"
    action_type: bullhorn_field_backfill  # yellow tier; REGISTERED in autosend-policy.yaml line 198 (sample_rate 10)
    cycle_step: 9
    state_changing: true

  - id: bullhorn_create_note
    package: "@ifos/bullhorn"
    purpose: "Attach tacit-note narrative from recent_edit harvest (Step 8 → Step 9); marker janitor_tacit_note_harvest per spec-001 §3 contract"
    action_type: bullhorn_note_attach   # yellow tier; REGISTERED in autosend-policy.yaml line 205 (sample_rate 20)
    cycle_step: 9
    state_changing: true

  # ────────────────────────────────────────────────────────────────────────
  # Dedup matcher (agent.md §4 Steps 3-4; local bin/ helper — no external
  # package, zero network; declared so the §4 capability citation resolves)
  # ────────────────────────────────────────────────────────────────────────

  - id: janitor_dedup_matcher
    purpose: "Deterministic duplicate-pair fuzzy matcher bin/dedup-pairs.sh (pure jq over stdin; zero network) — spec-001 weights name·0.3 + email·0.4 + phone·0.2 + linkedin·0.1 with comparable-weight normalisation + required strong identifier (build deviation 1); classifies every pair into the spec-001 §4 band→action table (auto ≥0.85+no-90d-activity / review 0.70–0.85 or recency-hold / silent drop <0.70). Shared by Step 3 (candidate) AND Step 4 (contractor — same matcher, separate entity_type)"
    cycle_step: 3
    state_changing: false

  # ────────────────────────────────────────────────────────────────────────
  # Companies House enrichment (clients only; agent.md §4 Step 6)
  # ────────────────────────────────────────────────────────────────────────

  - id: companies_house_search
    package: "@ifos/companies-house"
    purpose: "Lookup client CRN via name search; feeds Step 6 backfill of client.industry + client.companies_house_number"
    cycle_step: 6
    state_changing: false
    rate_limit_hint: "600/5min per IFOS API key; 7-day cache TTL per agent.md §4 Step 6; shared budget with Diagnostic"

  - id: companies_house_get_company
    package: "@ifos/companies-house"
    purpose: "Hydrate full company profile by CRN (post-search resolution); industry + size_employees fields"
    cycle_step: 6
    state_changing: false

  # ────────────────────────────────────────────────────────────────────────
  # Operator notification (Telegram operator-chat-id; not customer-facing)
  # ────────────────────────────────────────────────────────────────────────

  - id: telegram_notify
    package: "@ifos/telegram"
    purpose: "Operator-channel Telegram notifications (NOT customer-facing; green tier) — Step 11 nightly summary + ESC_DUPLICATE_DETECTED approval gate trigger"
    action_type: operator_notify_telegram  # green tier; REGISTERED in autosend-policy.yaml
    cycle_step: 11
    state_changing: false  # write to Telegram is an external side-effect but not on tenant data
    secrets_required: [TELEGRAM_BOT_TOKEN]

  # ────────────────────────────────────────────────────────────────────────
  # Cleanup (cleanup.sh)
  # ────────────────────────────────────────────────────────────────────────

  - id: janitor_cleanup
    purpose: "Post-run cleanup (transient @ifos/bullhorn 24h + @ifos/companies-house 7d cache purge + stale run workspaces)"
    action_type: janitor_cleanup    # green tier; QUEUED for registration (substrate-owner change; cleanup.sh emits hh_decision_output until registered — CC/Scout precedent)
    state_changing: false
    cycle_step: 12

# ──────────────────────────────────────────────────────────────────────────────
# Failure-modes table (per cluster Fbis pattern; ESC mapping per agent.md §6)
# ──────────────────────────────────────────────────────────────────────────────

failure_modes:

  - condition: "@ifos/bullhorn OAuth refresh fails after 2 retries (cycle.sh Step 1)"
    surface: "BullhornAuthError thrown by @ifos/bullhorn"
    escalation: ESC_BULLHORN_AUTH    # blocking; operator + ifos_oncall_chat_id per catalogue §2.5

  - condition: "@ifos/bullhorn returns 4xx/5xx on merge/backfill/note write (Step 9)"
    surface: "BullhornError (4xx skip; 5xx retry-once-then-skip)"
    escalation: ESC_BULLHORN_WRITE_FAIL   # warn; operator_chat_id

  - condition: "@ifos/bullhorn OR @ifos/companies-house returns 429 (Step 2/3/4/6)"
    surface: "BullhornRateLimitError OR CHRateLimitError"
    escalation: ESC_RATE_LIMIT_HIT   # warn; operator_chat_id; payload.upstream='bullhorn'|'companies-house'

  - condition: "Tacit-note narrative voice classifier <0.75 after 3 retries (Step 8 → validate.sh G5)"
    surface: "validate.sh exit 1 with G5 failure"
    escalation: ESC_VOICE_DRIFT      # warn; operator_chat_id

  - condition: "PII detected outside firm boundary in tacit-note narrative (validate.sh G6)"
    surface: "validate.sh exit 1 with G6 failure"
    escalation: ESC_PII_LEAKAGE_RISK   # blocking; operator + ifos_oncall_chat_id

  - condition: "Dedup proposal confidence below CTX_JANITOR_DEDUP_THRESHOLD (validate.sh G2) — output-shape constraint"
    surface: "validate.sh exit 1 with G2 failure"
    escalation: ESC_AGENT_OUTPUT_SHAPE   # warn; operator_chat_id

  - condition: "Dedup pair in the review band — confidence 0.70-0.85 OR ≥0.85 with 90d activity (cycle.sh Steps 3-4 classification; validate.sh G3 defence-in-depth) — SUCCESS-path approval gate, NOT Gate A failure code"
    surface: "cycle.sh Steps 3-4 emit per review pair; validate.sh exit 1 with G3 failure rejects any auto-write that slips through"
    escalation: ESC_DUPLICATE_DETECTED   # warn; operator_chat_id (via Telegram approval gate per catalogue §2.5)

  - condition: "Write batch exceeds the 100/min defensive cap (validate.sh G7; remainder defers to the next run)"
    surface: "validate.sh exit 1 with G7 failure"
    escalation: ESC_AGENT_OUTPUT_SHAPE   # warn; operator_chat_id (spec-001 §5 routing)

  - condition: "BOTH Gate B thresholds miss for 3 consecutive runs (cycle.sh Step 12 exit-code path; per agent.md §5 ESC_GATE_B_MISS row + catalogue trigger)"
    surface: "cycle.sh exit 1 with ESC_GATE_B_MISS"
    escalation: ESC_GATE_B_MISS       # warn; operator_chat_id (heuristic tuning may be needed; not a kill)

