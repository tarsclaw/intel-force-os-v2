# Expected behaviour
expected:
  brief_ingestion:
    key_dims_extracted: 6   # role + location + salary + role_type + must_haves count + nice_to_haves count
  source_queries:
    bullhorn: { returned: 8, queried: true }
    linkedin: { returned: 0, queried: false, reason: "v1.0_no_op_per_proxycurl_shutdown" }
    reed: { returned: 6, queried: true }
    cvlibrary: { returned: 4, queried: true }
  aggregate_dedupe:
    pre_dedupe: 18         # 8 + 6 + 4
    post_dedupe: 15        # 3 cross-source matches merged (Alice/Bob/Carol surfaced twice)
    cross_source_provenance:
      - { name: "Alice Anderson", sources: ["bullhorn", "reed"] }
      - { name: "Bob Brown", sources: ["bullhorn", "reed"] }
      - { name: "Carol Chen", sources: ["bullhorn", "cvlibrary"] }
  dnc_filter:
    dropped: 2             # Grace Green (email match) + Henry Hall (phone match)
    kept: 13               # 15 post-dedupe - 2 DNC = 13
  rationale_generation:
    rationales_generated: 13
    voice_state: unscored_no_corpus   # v1.0 honesty; G4 warns, never fails on unscored
    voice_drift_drops: 0
  validate_gate_a:
    g1_pass: true          # 13 in [5, 15]
    g2_pass: true          # all have contact methods
    g3_pass: true          # all ≥50 words
    g4_pass: true          # warn-when-unscored (no corpus); hard once classifier lands
    g5_pass: true          # DNC already filtered Step 8
    g6_pass: true          # no PII outside firm boundary
    g7_pass: true          # 3 sources contributed
    overall: PASS
  vault_artefact:
    written: true
    path: "/vault/migration-test/sourcing-scout-reports/12345-2026-06-03.md"
    sections_present: ["brief_context", "ranked_candidates", "source_breakdown", "diagnostic_exception_list"]
    candidate_count: 13
    exception_list_includes_dnc_drops: true   # 2 DNC drops noted in diagnostic section
  operator_notification:
    channel: telegram
    chat_id: "operator-test-chat-id"
    tier: green
  audit_rows_emitted:
    - phase: trigger
      action_type: session_start
    - phase: output
      output_type: brief_ingested
    - phase: output
      output_type: auth_refresh_complete
    - phase: output
      output_type: bullhorn_query
    - phase: output
      output_type: linkedin_query
      payload_contains: "v1.0_caveat_proxycurl_shutdown"
    - phase: output
      output_type: reed_query
    - phase: output
      output_type: cvlibrary_query
    - phase: output
      output_type: aggregate_dedupe
    - phase: output
      output_type: dnc_filter
    - phase: output
      output_type: candidate_proposed   # ONE row PER candidate (13× included:true + 2× DNC included:false)
    - phase: output
      output_type: scout_report
    - phase: action
      action_type: scout_run_complete
