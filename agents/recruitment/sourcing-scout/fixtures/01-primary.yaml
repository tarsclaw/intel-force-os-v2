# Sourcing Scout fixture — 01-primary (happy path)
#
# W9 BUILD-SLICE ALIGNMENT (spec-003): marker names follow the spec-003 §3
# downstream contract (bullhorn_query / linkedin_query / candidate_proposed
# per candidate) — the skeleton-era names (bullhorn_passive_query /
# linkedin_search_skipped / rationale_generation) are superseded. Arithmetic
# corrected to the data: 18 pre-dedupe → 15 post-dedupe (3 cross-source
# pairs: Alice, Bob, Carol) → 2 DNC drops → 13 final. Voice scores are
# recorded unscored/no_corpus at v1.0 (empty tenant voice_corpus; honest
# signal per spec-003 §8) — the mocked ≥0.75 scores below describe the
# post-classifier enhancement, not the v1.0 run.
#
# Tests the canonical flow per agent.md §3 + §4:
#   cycle.sh mode=cli + --brief-id → @ifos/bullhorn getBrief returns
#   "Senior React Engineer, London, £100k-£120k, hybrid" → context.sh
#   resolves 3 sources active (Bullhorn + Reed + CV-Library) →
#   Step 3 Bullhorn passive-match query returns 8 passive candidates →
#   Step 4 LinkedIn NO-OP (v1.0 caveat) → Step 5 Reed search returns 6
#   candidates → Step 6 CV-Library returns 4 candidates → Step 7 aggregate
#   yields 18 pre-dedupe, 15 post-dedupe → Step 8 DNC filter drops 2 →
#   Step 9 produces 13 rationales all ≥50 words (voice: unscored/no_corpus
#   at v1.0) → Step 10 Gate A G1-G7 all pass → vault Markdown
#   report at /vault/migration-test/sourcing-scout-reports/<slug>-<ISO>.md →
#   Step 11 Telegram notification to operator.
#
# Per agent.md §5: 13 candidates within [5, 15] range (G1 PASS); all have
# working contact methods (G2 PASS); all rationales ≥50 words (G3 PASS);
# voice scores ≥0.75 (G4 PASS); no DNC matches (G5 PASS); no PII (G6 PASS);
# 3 sources contributed (G7 PASS).
#
# Status: Proposed (W5 Day-33 SKELETON; W9 build slice wires the real
#         package calls + verifies fixture expectations against actual outputs).

fixture_id: 01-primary
description: Happy path — 3 sources active; 18 pre-dedupe → 15 post-dedupe → 13 after DNC filter; Gate A all pass; vault report written
tenant_slug: migration-test
agent: sourcing-scout
expected_gate_a: PASS
expected_exit_code: 0

invocation:
  command: ifosctl sourcing-scout source
  flags:
    - --mode
    - cli
    - --tenant
    - migration-test
    - --brief-id
    - "12345"

# Tenant config (per context.sh hydration; v0.4 supplement LIVE on VPS allows
# bullhorn_corporation_id top-level read; v0.3 allows blocked_recipients).
tenant_config:
  bullhorn_corporation_id: "9876"
  firm_domains: "acme.test"
  blocked_recipients:
