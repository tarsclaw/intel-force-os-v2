#   concierge_approval_routed          green               [R19 registration; emitted Step 11]
#   gmail_outlook_send_to_candidate    orange              [TRANSPORT row; emitted Step 12 post-approval]
#   bullhorn_note_customer_visible     orange              [canonical orange; alt channel — not yet emitted in v1.0]
