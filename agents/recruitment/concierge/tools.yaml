#   twilio_sms_send                    orange              (v1.1+)
#   calendar_invite_send               orange              (v1.1+)

# ──────────────────────────────────────────────────────────────────────────────
# Boundary check (per master brief §3 + review-mcp-connector.md §8)
# ──────────────────────────────────────────────────────────────────────────────
#
# - No Composio / AgentMail references anywhere in this file.
# - All packages declared are @ifos/* — no third-party adapters with policy
#   semantics smuggled in via tools.yaml.
# - Action types all map to autosend-policy.yaml tiers (or are explicitly
#   marked QUEUED above for the W-X build-slice registration).
# - microsoft-graph + gmail are the v1.0 send paths per agent.md §1; agent-
#   identity email adapter explicitly deferred to v1.1+ per agent.md header.
