#   concierge_approval_routed          orange-adjacent     [R19 registration fix]
#   gmail_outlook_send_to_candidate    orange              [shared with Cash Conductor at audit layer when bullhorn channel = email]
#   bullhorn_note_customer_visible     orange              [canonical orange]
#   operator_notify_telegram           green
#
# QUEUED for registration when their build wave clears:
#   bullhorn_oauth                     green               (W7 Janitor + Bullhorn partnership)
#   bullhorn_activity_log_write        green               (W10-13 Concierge build slice)
