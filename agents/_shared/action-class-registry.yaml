    routing_rule: function_role:business_development
    trust_bucket: 3
    escalation_after_minutes: null
    ttl_minutes: null
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  linkedin_inmail_send:
    routing_rule: record_owner             # Scout desk-bound; JobOrder owner (§4.1)
    # seed-judgement: Bucket 3, not Scout's §4.1 default 1 — that default
    # covers the read-only sourcing pass ("rarely approves"). InMail is
    # first-contact outreach to someone with no prior relationship, on a
    # paid credit, with reputation effects — the §2 Bucket-3
    # "first-contact … outreach" register.
    trust_bucket: 3
    escalation_after_minutes: null
    ttl_minutes: null
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  bullhorn_placement_terminate:
    routing_rule: function_role:ops_data   # Janitor function-bound (§4.1)
    # seed-judgement: Bucket 3, not Janitor's §4.1 default 2 — that default
    # covers cleanup tags/batches; terminating a placement has
    # commercial/legal implications (autosend reason) and is
    # relationship-sensitive → always asks.
    trust_bucket: 3
    escalation_after_minutes: 1440         # seed-judgement: ops chain hop to founder after 24h, mirroring §6.3 ops_data ttl_minutes 1440 (low urgency, but a stuck termination shouldn't sit with one person forever)
    ttl_minutes: null
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  # ───────────────────────────────────────────────────────────
  # RED tier — blocked before routing (8 action_types)
  # Red is refused entirely at the autosend gate (ESC_AUTOSEND_BLOCKED; red is
  # the tier-override floor). Bucket 3 and NEVER graduates — standing-approval
  # grants MUST refuse red action_types. Rows exist only so the
  # autosend-policy join is total; no resolver/TTL semantics ever apply.
  # ───────────────────────────────────────────────────────────

  xero_payment_initiate:
    routing_rule: function_role:finance
    trust_bucket: 3                        # never graduates (red floor)
