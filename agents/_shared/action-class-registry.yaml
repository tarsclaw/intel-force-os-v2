    escalation_after_minutes: null
    ttl_minutes: null
    on_expiry: hold
    # seed-judgement: breaks_quiet_hours false despite function-roles.yaml
    # §6.3 seeding BD with true — that flag exists for the
    # competitor-interception window (v1.1); diagnostic outreach overnight
    # is reputation risk, not opportunity.
    breaks_quiet_hours: false
    digest_eligible: true

