# IFOS action-class registry (approval-routing properties per action_type)
#
# Status: Proposed (W2 build slice 2026-06-11; Codex ratification in flight;
# flips to Accepted on ratification + founder sign-off, In Force when the W3
# orange-path integration consumes it in production).
#
# Source of truth: docs/specs/approval-routing-architecture.md §2 (trust
# buckets), §4.1 (agent → routing class), §5.1 (the five routing properties),
# §5.2 (on-expiry behaviours), §5.3 (quiet hours / digest), §10 decisions 1+2.
# Build slice: docs/features/approval-routing/PLAN.md W2 (architectural
# decisions 3, 4, 9).
#
# SHIPPED, NOT CONFIGURED. Tenants never edit this file. Per-tenant variation
# enters ONLY via /vault/{tenant_slug}/routing/function-roles.yaml (who holds
# each function role — vault per spec §6.2 "It's a vault file") and standing-
# approval GRANT/REVOKE rows in Postgres decision_log (which Bucket-2 classes
# have graduated — structured state lives in Postgres per the vault/Postgres
# split, boundary 3; amended at Codex W2 R1). The rows here are product
# policy, identical for every firm — same pattern as autosend-policy.yaml.
#
# JOIN KEY: action_type keys are EXACTLY the keys of
# agents/_shared/autosend-policy.yaml (grep-verified 2026-06-11: 53 keys —
# 25 green + 10 yellow + 10 orange + 8 red. The "47 total" invariant comment
# in autosend-policy.yaml predates the post-freeze additions (4 MCP OAuth
# rows, bullhorn_activity_log_write, concierge_approval_routed) and is stale;
# this registry keys off the ACTUAL file). A key absent here while present
# in autosend-policy.yaml is a defect — the resolver must fail safe to the
# single-operator fallback (PLAN decision 2) and log routing_fallback.
#
# Each row carries (spec §5.1 — the five routing properties + digest flag):
#   routing_rule              record_owner | function_role:<finance|ops_data|
#                             business_development|candidate_comms_default|
#                             client_comms_default|admin>. Which ladder rung
#                             resolves the approver (spec §4). record_owner =
#                             Bullhorn owner of the acted-on record;
#                             function_role:X = function-roles.yaml lookup.
#   trust_bucket              1 never-asks | 2 asks-once-then-graduates |
#                             3 always-asks (spec §2). Graduation of Bucket 2
#                             is firm-admin-only, evidence-gated <2% override
#                             over 30 days (spec §2 + §10 decision 2).
#   escalation_after_minutes  minutes before the approval re-proposes to the
#                             next hop in the escalation chain (chain itself
#                             lives in function-roles.yaml / desk hierarchy).
#                             null = no hop; holds with the resolved approver.
#   ttl_minutes               minutes before on_expiry fires. null = hold
#                             indefinitely (spec §5.1 credit-note column).
#   on_expiry                 hold | auto_execute | safe_default (spec §5.2).
#                             auto_execute is seeded NOWHERE — it is only
#                             reachable for classes already past the
#                             graduation gate, at runtime, never as a seed.
#   breaks_quiet_hours        may the approval ping outside the firm's quiet
#                             hours (spec §5.3). Only genuinely live candidate
#                             flows seed true.
#   digest_eligible           may a pending/held/spot-check item batch into
#                             the 08:30 morning digest (spec §5.3; held
#                             Bucket-3 items surface there too per the §5.1
#                             credit-note row "no — morning digest").
#   dormant                   true = class belongs to a v1.1+ agent/path and
#                             never fires in v1.0 (PLAN decision 4).
#
# Bucket-1 (green-tier) rows: the resolver is never consulted — green actions
# auto-send without review (autosend-policy.yaml). Rows are present so the
# join over autosend keys is total; routing_rule records the owning agent's
# §4.1 class for audit/digest attribution only.
#
# Red-tier rows: blocked entirely BEFORE routing (ESC_AUTOSEND_BLOCKED; red is
# the tier floor). Bucket 3, hold, NEVER graduates — standing-approval grants
# must refuse red action_types. Rows present for join completeness only.
#
# Schema version stamps into routing audit payloads at resolution time.

schema_version: 1
