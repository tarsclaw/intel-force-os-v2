# ───────────────────────────────────────────────────────────
# v1.1+ agent classes (Client Hunter / Competitor Interception, Spec Pitcher /
# Network Compounder, Inbound Triage, …) have NO action_type keys registered
# in autosend-policy.yaml yet, so they have no rows here. When their keys are
# registered, seed them per spec §4.1 (Client Hunter → function_role:
# business_development, bucket 3; Spec Pitcher → record_owner, bucket 3) and
# mark `dormant: true` until the agent ships. The only currently-registered
# v1.1 key is open_banking_plaid_uk (dormant above).
#
# Compile-time consistency assertions (enforced by the W1/W3 resolver loader,
# not by YAML itself — documented here so Codex can verify):
# ───────────────────────────────────────────────────────────

invariants:
  - "action_types keys == autosend-policy.yaml action_types keys (set equality; join must be total)"
  - "routing_rule ∈ {record_owner} ∪ {function_role:<finance|ops_data|business_development|candidate_comms_default|client_comms_default|admin>}"
  - "trust_bucket ∈ {1, 2, 3}"
  - "on_expiry ∈ {hold, auto_execute, safe_default}"
  - "on_expiry == safe_default ⇒ a bundled holding-reply template exists for the class's REGISTER (the email holding-reply body doubles as the SMS register; a dedicated SMS variant may land with the W5 on-expiry machinery)"
  - "auto_execute never appears as a seed; runtime-only, post-graduation (spec §5.2 rule 2)"
  - "red-tier action_types: trust_bucket == 3, never graduate, standing-approval grants refused"
  - "ttl_minutes == null ⇒ on_expiry never fires (hold indefinitely)"
