  # ───────────────────────────────────────────────────────────
  # ORANGE tier — the real routing consumers (10 action_types)
  # Candidate-side comms → Bucket 2 (graduate-eligible), desk-lead hop after
  # 30 min, TTL ~120m (spec §5.1 candidate-ack column).
  # Client/finance/prospect-facing → Bucket 3: hold, null TTL, no quiet-hours
  # break, surfaces in morning digest (spec §5.1 credit-note column + §2).
  # ───────────────────────────────────────────────────────────

  bullhorn_note_customer_visible:
    routing_rule: record_owner             # Concierge desk-bound (§4.1)
    trust_bucket: 3                        # CLIENT-visible: autosend-policy's own reason says
                                           # "customer-visible in their CRM" + irreversible —
                                           # spec §2 "outbound to a client never graduates"
                                           # (W2 review finding 1, fixed 2026-06-11)
    escalation_after_minutes: 30           # → desk lead after 30 min (§5.1 example)
    ttl_minutes: null                      # Bucket-3 client-facing: holds indefinitely (§5.2)
    # seed-judgement: on_expiry hold, NOT safe_default — a customer-visible
    # CRM note is not a live email conversation; the §5.2 holding-reply
    # register does not fit a Note artefact. Nothing is lost by holding.
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  gmail_outlook_send_to_candidate:
    # THE candidate-acknowledgement class (highest volume). §10 decision 1:
    # on-expiry sends the pre-approved holding reply; the full personalised
    # draft still waits for human approval in the morning (§5.2).
    routing_rule: record_owner
    trust_bucket: 2
    escalation_after_minutes: 30           # → desk lead (§5.1 example column)
    ttl_minutes: 120                       # 2 hours (§5.1 example column)
    on_expiry: safe_default                # §10 decision 1
    breaks_quiet_hours: true               # live candidate flow (§5.1 "yes if live conversation" + §5.3)
    digest_eligible: true

  twilio_sms_send:
    routing_rule: record_owner             # Concierge desk-bound (§4.1)
    trust_bucket: 2
    # seed-judgement: SMS is THE live-conversation channel §5.2 exists to
    # protect; autosend timeout is PT30M (vs PT4H default), so the whole
    # escalate→expire cycle compresses: hop at 15 min, expiry at 30 min,
    # holding reply fits the SMS register. digest_eligible false — a pending
    # SMS is time-sensitive by definition; batching it to 08:30 is wrong.
    escalation_after_minutes: 15
    ttl_minutes: 30
    on_expiry: safe_default
    breaks_quiet_hours: true
    digest_eligible: false

  calendar_invite_send:
    routing_rule: record_owner
    trust_bucket: 2
    escalation_after_minutes: 30
    ttl_minutes: 240                       # mirrors autosend timeout PT4H
    # seed-judgement: hold — there is no holding-reply analogue for a
    # calendar invite with attendee notification; an unbooked slot waits.
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  email_summary_to_customer:
    routing_rule: record_owner             # Scribe desk-bound: consultant who had the call (§4.1)
    # seed-judgement: Bucket 3, not Scribe's §4.1 default 2 — "customer" here
    # is the client; §2 Bucket 3 is explicit that "outbound to a *client*"
    # always asks and never graduates. §4.1's Scribe bucket-2 default covers
    # internal note-writing, not client-facing sends.
    trust_bucket: 3
    escalation_after_minutes: null
    ttl_minutes: null                      # holds indefinitely (Bucket 3)
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true                  # held items surface in morning digest (§5.1 credit-note row)

  xero_reminder_send_customer:
    routing_rule: function_role:finance    # Cash Conductor function-bound (§4.1)
    trust_bucket: 3                        # finance action — always asks (§2 + §4.1)
    escalation_after_minutes: null         # §5.1 credit-note column: escalation chain → none
    ttl_minutes: null
    on_expiry: hold
    breaks_quiet_hours: false
    digest_eligible: true

  diagnostic_email_send:
    routing_rule: function_role:business_development   # seed-judgement: sales-stage prospect outreach → BD function
