# ──────────────────────────────────────────────────────────────────────────────
# Boundary check (per master brief §3 + review-mcp-connector.md §8)
# ──────────────────────────────────────────────────────────────────────────────
#
# - No forbidden third-party adapter references anywhere in this file (adapter boundary, CLAUDE.md boundary 2).
